name: TradeBot Continuous

on:
  workflow_dispatch:
  schedule:
    - cron: "0 * * * *"

permissions:
  contents: read
  actions: write

concurrency:
  group: tradebot-continuous
  cancel-in-progress: false

jobs:
  run-bot:
    runs-on: ubuntu-latest
    timeout-minutes: 360
    env:
      CHUNK_MINUTES: "340"
      PYTHON_BIN: python3
      PYTHONDONTWRITEBYTECODE: "1"
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install -r requirements.txt

      - name: Write .env from secrets
        shell: bash
        run: |
          if [[ -z "${{ secrets.APCA_API_KEY_ID }}" ]] || [[ -z "${{ secrets.APCA_API_SECRET_KEY }}" ]]; then
            echo "Missing APCA_API_KEY_ID or APCA_API_SECRET_KEY repository secrets" >&2
            exit 1
          fi
          cat > .env << 'EOF'
          APCA_API_KEY_ID=${{ secrets.APCA_API_KEY_ID }}
          APCA_API_SECRET_KEY=${{ secrets.APCA_API_SECRET_KEY }}
          EOF

      - name: Run bot chunk
        shell: bash
        run: |
          chmod +x scripts/run_bot_action.sh
          ./scripts/run_bot_action.sh

      - name: Upload logs and data artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: bot-logs-${{ github.run_id }}
          path: |
            logs/
            src/runtime_params.json
            trade_log.csv
          if-no-files-found: warn
          retention-days: 30

      - name: Commit runtime_params.json
        shell: bash
        run: |
          git config --global user.name "github-actions"
          git config --global user.email "github-actions@github.com"
          git add src/runtime_params.json src/model.keras
          git commit -m "Update runtime_params.json and model.keras [skip ci]" || echo "No changes to commit"
          git push

      - name: Re-dispatch workflow
        if: always()
        shell: bash
        run: |
          curl -sS -X POST \
            -H "Accept: application/vnd.github+json" \
            -H "Authorization: Bearer ${{ secrets.GITHUB_TOKEN }}" \
            https://api.github.com/repos/${{ github.repository }}/actions/workflows/tradebot-continuous.yml/dispatches \
            -d '{"ref":"${{ github.ref_name }}"}'
